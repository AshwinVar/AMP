name: CI

# Runs on every push and pull request — catches build/syntax breakage before deploy.
on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # A throwaway SQLite file stands in for Postgres. database.py deliberately
    # has NO fallback (a missing DATABASE_URL must fail loudly in production),
    # so CI supplies its own. The suites build their own in-memory engines;
    # this one only satisfies import-time wiring and the boot check.
    env:
      DATABASE_URL: "sqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile-check backend
        run: python -m compileall -q backend
      # Each suite is a standalone script (exit 0 = pass) that also collects
      # under pytest. Run them from backend/ — imports are flat (import models).
      # Every suite runs even if one fails, so a red build reports ALL breakage.
      - name: Run backend test suites
        working-directory: backend
        run: |
          failed=""
          for f in test_*.py; do
            echo "::group::$f"
            if python "$f"; then echo "PASS $f"; else echo "FAIL $f"; failed="$failed $f"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing suites:$failed"
            exit 1
          fi
          echo "All $(ls test_*.py | wc -l) suites passed."
      - name: Boot check (app imports and registers routes)
        working-directory: backend
        run: python -c "import main; print(f'{len(main.app.routes)} routes registered')"

  # Branch-coverage floor. A SEPARATE job from `backend` on purpose.
  #
  # The `backend` job's answer is "do the tests pass", and that answer must not
  # be polluted by a second, weaker question. If the floor lived in that job, a
  # coverage dip would turn the checks list red with the same colour as a real
  # failure and the first instinct would be to lower the number. Kept apart, the
  # two failures are told apart at a glance.
  #
  # It re-runs the suites rather than reusing the other job's run because the
  # per-file runner CI contracts on (`python test_X.py`, one process per suite)
  # cannot be measured without combining 169 coverage files. pytest collects the
  # same functions in one process — see backend/conftest.py for the two shims
  # that makes possible, and docs/TESTING.md for why the runner stays as it is.
  #
  # pytest-cov is installed HERE and not in requirements.txt: it is a measurement
  # tool, not something the application needs at runtime, and putting it in the
  # runtime image to satisfy a CI job is how deployment images grow.
  coverage:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install coverage tooling
        run: pip install "pytest-cov>=5,<8"
      # --cov-fail-under lives on the command line, NOT in .coveragerc. A
      # config-level floor also applies to a partial run, so `pytest test_oee.py
      # --cov` would exit non-zero every single time and train everyone to
      # ignore the number. The threshold is derived from a measurement and the
      # arithmetic behind it is in docs/TESTING.md — raise it as the number
      # climbs, never lower it to make a build pass.
      - name: Branch coverage floor
        working-directory: backend
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=78
      # The full report is worth reading even when the gate passes: it is the
      # only place the untested modules are named.
      - name: Publish the report
        if: always()
        working-directory: backend
        run: |
          {
            echo '### Backend branch coverage'
            echo
            echo '```'
            python -m coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Unit tests
        run: cd frontend && npm test
      - name: Build frontend
        run: cd frontend && npm run build
      # The load harness's endpoint catalogue is a hand transcription of
      # fetchAll() in app/dashboard/page.tsx. The moment someone adds a card and
      # forgets to update it, the harness stops measuring the real dashboard
      # while still printing confident-looking numbers — and a silently wrong
      # benchmark is worse than none, because people act on it.
      #
      # Plain Node, no k6 and no server, so it costs a second and can be a
      # required check rather than something that runs when someone remembers.
      - name: Load-harness endpoint drift
        run: node load/check-drift.mjs

  # Browser tests. A separate job from `frontend` on purpose: it needs a browser
  # binary (~150MB) that the unit-test job has no use for, and keeping them
  # apart means a Playwright failure names itself in the checks list rather than
  # hiding inside a job called "frontend".
  #
  # No backend and no database. Every request is answered by page.route()
  # interception from e2e/support/mock-api.ts, so the suite is deterministic and
  # tests the FRONTEND's behaviour rather than the API's availability. Set
  # E2E_LIVE_API=1 locally to drive a real backend instead.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      # Only chromium: playwright.config.ts pins a single browser project, and
      # installing the other two would triple the download for no coverage.
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      # playwright.config.ts builds and serves the app itself (webServer), so
      # there is no separate build step here.
      - name: Browser tests
        run: cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        # Upload on failure too - the trace and screenshots are the whole point
        # of having a report when a browser test fails in CI and not locally.
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

