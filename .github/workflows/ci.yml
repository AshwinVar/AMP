name: CI

# Runs on every push and pull request — catches build/syntax breakage before deploy.
on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # A throwaway SQLite file stands in for Postgres. database.py deliberately
    # has NO fallback (a missing DATABASE_URL must fail loudly in production),
    # so CI supplies its own. The suites build their own in-memory engines;
    # this one only satisfies import-time wiring and the boot check.
    env:
      DATABASE_URL: "sqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile-check backend
        run: python -m compileall -q backend
      # Each suite is a standalone script (exit 0 = pass) that also collects
      # under pytest. Run them from backend/ — imports are flat (import models).
      # Every suite runs even if one fails, so a red build reports ALL breakage.
      - name: Run backend test suites
        working-directory: backend
        run: |
          failed=""
          for f in test_*.py; do
            echo "::group::$f"
            if python "$f"; then echo "PASS $f"; else echo "FAIL $f"; failed="$failed $f"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing suites:$failed"
            exit 1
          fi
          echo "All $(ls test_*.py | wc -l) suites passed."
      - name: Boot check (app imports and registers routes)
        working-directory: backend
        run: python -c "import main; print(f'{len(main.app.routes)} routes registered')"

      # THE SALES DEMO, WALKED BY A MACHINE. A demo that breaks in front of a
      # prospect is worse than no demo, and nothing else in CI would notice: it
      # is a specific sequence across the OEM and factory APIs plus the MQTT
      # handler, and every individual piece can stay green while the sequence
      # stops working.
      #
      # Its own STEP rather than a `test_*.py` file, deliberately. The coverage
      # job collects every test file into ONE pytest process, and this harness
      # drops and recreates its schema — collected there it would take the
      # shared database out from under the other suites, which is the hazard
      # test_mqtt_tenant_identity.py documents at length. A separate process
      # with its own DATABASE_URL cannot do that.
      - name: The AERON sales demo still works end to end
        working-directory: backend
        env:
          DEMO_PASSWORD: ci-demo-password
        run: python audit_oem_demo_journey.py

      # THE ASSUMPTIONS THE OEM BOUNDARY RESTS ON (ADR-0017, ADR-0019): one code
      # path puts a machine at a factory, every grant is validated before it is
      # stored, no /oem handler writes a factory link. It ran only by hand, and
      # two of its checks went stale within a day of the changes that broke them
      # (#614, #616), reporting findings while the product was correct. Nobody saw,
      # because nothing ran it. It reads the code and builds in-memory databases,
      # so it takes seconds and touches nothing the suites share.
      - name: The OEM boundary's assumptions still hold (specialist audit)
        working-directory: backend
        run: python audit_oem_specialist.py

      # THE TWO ADVERSARIAL AUDITS THAT NEED NO SERVER. Each plays the attacker
      # with inputs no happy path produces: a tenant claim that is a list, a
      # topic with path traversal, a replayed acceptance, an id that probes for a
      # 500. Both passed when this step was added, and both ran only by hand,
      # which is how the specialist audit above and 13 mutation tests went stale
      # unseen (#633, #635, #638). They take seconds. Each drops and recreates
      # its database's schema, so each gets its own file, not ci.db.
      - name: Six shipped fixes survive adversarial input (audit)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./audit_adversarial_final.db"
        run: python audit_adversarial_final.py
      - name: Service contracts refuse every attack on their boundary (audit)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./audit_contracts_adversarial.db"
        run: python audit_oem_contracts_adversarial.py
      # THE OWNER'S EIGHT QUESTIONS, across four factory shapes in ONE process.
      # Its own step rather than a test_*.py file, for the same reason as the
      # demo journey above: it holds four tenants in one database at once, and
      # the rules it checks (money nowhere on nine surfaces, no factory's words
      # on another's screen) only exist BETWEEN surfaces, so no per-surface
      # suite can hold them.
      - name: The owner's eight questions, across four factory shapes (audit)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./audit_owner_questions.db"
        run: python audit_owner_questions.py
      # The simulator is the one writer with no request, no user and no JWT:
      # it animates several tenants from ONE loop, every 45 s, and its only
      # scoping is a contextvar the loop binds per tick. This runs the loop's
      # exact tick sequence for three factories at once and proves every row
      # landed with the tenant it ran for, no row points at another tenant's
      # machine, and a tick with no tenant bound refuses (it used to file
      # every tenant's activity under DEFAULT).
      - name: Three factories animated by one simulator loop never cross (audit)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./audit_three_factory_simulation.db"
        run: python audit_three_factory_simulation.py

  # AMP EDGE — the gateway that runs inside a customer's factory.
  #
  # Its own job, not part of `backend`, for two reasons. It has DIFFERENT
  # dependencies (an OPC UA stack, a Modbus stack, an MQTT client) that a
  # Railway deploy must never pull in; and its tests stand up real servers on
  # real sockets, so a port clash should fail the gateway, not the whole API.
  #
  # The end-to-end suites DO import the AMP backend, deliberately: proving the
  # gateway produces a payload is worthless if that payload does not land on the
  # right machine. That is the one direction the boundary allows — a test may
  # cross it; the shipped gateway may not.
  edge:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./ci_edge.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies (the last hop is the real AMP handler)
        run: pip install -r backend/requirements.txt
      - name: Install gateway dependencies
        run: pip install -r edge/requirements.txt
      - name: Compile-check the gateway
        run: python -m compileall -q edge
      - name: The gateway imports nothing from AMP
        # THE ARCHITECTURAL BOUNDARY, ENFORCED. `ampedge` must be installable on
        # a plant PC that has never heard of FastAPI. An accidental `import
        # models` would work fine in this repo and fail on every customer's
        # machine, so it is checked rather than trusted.
        run: |
          cd edge
          if grep -rnE "^[[:space:]]*(from|import) (models|main|database|schemas|tenancy|mqtt_service|crud)([. ]|$)" ampedge/; then
            echo "::error::ampedge imports the AMP backend — the gateway must stand alone"
            exit 1
          fi
          echo "ampedge is self-contained."
      - name: Run gateway test suites
        run: |
          failed=""
          for f in edge/test_*.py; do
            echo "::group::$f"
            if python "$f"; then echo "PASS $f"; else echo "FAIL $f"; failed="$failed $f"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing gateway suites:$failed"
            exit 1
          fi
          echo "All $(ls edge/test_*.py | wc -l) gateway suites passed."
      - name: The example configs are valid
        # A broken example is worse than no example: it is the first thing a
        # pilot engineer copies.
        env:
          AMP_GATEWAY_KEY: ci-not-a-real-key
          PLC_PASSWORD: ci-not-a-real-password
        run: |
          cd edge
          python -m ampedge validate examples/opcua-gateway.yaml
          python -m ampedge validate examples/modbus-gateway.yaml

  # THE MIGRATION GATE (ADR-0018). A separate job because it needs a real
  # PostgreSQL server, and because its answer is a different question from "do
  # the tests pass".
  #
  # WHY IT EXISTS. On 2026-08-09 every login on production returned 500 for a
  # day: `models.User.is_active` existed in the code and `users.is_active` did
  # not exist in the database (#513). All 186 suites were green throughout, and
  # could not have been otherwise — every one of them builds its schema with
  # `create_all()` on a FRESH database, which is the one arrangement in which
  # model/schema drift cannot occur. The defect lived in the gap between a
  # database that already exists and a model that has moved on, and nothing in
  # CI went anywhere near that gap.
  #
  # So this job does two things no SQLite-and-create_all job can:
  #
  #   DRIFT   migrate a fresh PostgreSQL to head, then ask Alembic to autogenerate
  #           against models.py. A non-empty diff means somebody changed a model
  #           without writing the migration — #513, caught before merge.
  #   UPGRADE run the full deployment matrix (verify_pg_deploy.py): a
  #           production-shaped old database refuses traffic, the migration
  #           repairs it, login works; a failing migration exits non-zero and
  #           rolls back; a database behind head is refused.
  migrations:
    name: Migration gate (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the major version Railway runs, because the behaviours under
        # test are engine behaviours: transactional DDL, metadata-only NOT NULL
        # adds, and constraint-name reflection.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/amp_ci"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Create the CI database
        run: psql -h localhost -U postgres -c "CREATE DATABASE amp_ci"

      # 1. THE DRIFT DETECTOR: a model changed and the migration is missing.
      #
      # The database is built from a FROZEN SNAPSHOT of the schema
      # (alembic/baseline_schema.sql), NOT from models.py. That is the whole
      # trick, and the first version of this gate got it wrong: building with
      # `create_all()` and then diffing against the models compares the models
      # to themselves and returns "no drift" no matter how far the migrations
      # lag. See backend/snapshot_baseline.py.
      #
      # Snapshot -> stamp baseline -> run every migration -> compare to models.
      # That is also, precisely, production's upgrade path.
      - name: Build a database from the FROZEN baseline snapshot
        working-directory: backend
        run: |
          set -euo pipefail
          python snapshot_baseline.py --check
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f alembic/baseline_schema.sql
          python -m alembic stamp 0001_baseline

      - name: Run every migration on top of it
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Models and migrations must agree (autogenerate diff is empty)
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from sqlalchemy import create_engine

          import models  # noqa: F401  (registers every table)
          from database import Base

          # The same include_object rules env.py uses, so this agrees with
          # `alembic revision --autogenerate` instead of arguing with it.
          def include_object(obj, name, type_, reflected, compare_to):
              if type_ == "table" and name == "alembic_version":
                  return False
              if type_ == "index" and reflected and compare_to is None:
                  return False
              return True

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              ctx = MigrationContext.configure(
                  conn,
                  opts={"include_object": include_object, "compare_type": True},
              )
              diff = compare_metadata(ctx, Base.metadata)

          # Server defaults are deliberately NOT compared (compare_server_default
          # stays off, as in env.py): SQLAlchemy renders `true` and PostgreSQL
          # reports `true`, and the two disagree textually often enough that
          # comparing them would make this gate cry wolf and get muted.
          if diff:
              print("::error::MIGRATION DRIFT - models.py and the migrations disagree.")
              print("A model was changed without a migration. This is the #513 failure")
              print("class: the code deploys and the database does not have the change.")
              print("Write the migration:")
              print("    cd backend && alembic revision --autogenerate -m '<what changed>'")
              print("Do NOT regenerate baseline_schema.sql to silence this.")
              print()
              for d in diff:
                  print("  ", d)
              raise SystemExit(1)
          print("no drift: every model change has a migration")
          PY

      # The gate must be able to FAIL, or it is decoration. Add a column to
      # models.py that no migration adds, and require the diff to appear.
      - name: Prove the drift detector detects drift
        working-directory: backend
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          src = io.open("models.py", encoding="utf-8").read()
          # The User class header, which is unique. The `is_active` line is NOT:
          # three models declare it identically, so anchoring on it would have
          # patched whichever class happened to come first.
          anchor = 'class User(Base):\n    __tablename__ = "users"\n'
          assert src.count(anchor) == 1, "anchor moved; update this check"
          io.open("models.py", "w", encoding="utf-8", newline="\n").write(
              src.replace(anchor, anchor + '    drift_probe = Column(String, nullable=True)\n', 1))
          PY
          set +e
          python - <<'PY'
          import os
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from sqlalchemy import create_engine
          import models  # noqa: F401
          from database import Base

          def include_object(obj, name, type_, reflected, compare_to):
              if type_ == "table" and name == "alembic_version":
                  return False
              if type_ == "index" and reflected and compare_to is None:
                  return False
              return True

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as conn:
              ctx = MigrationContext.configure(
                  conn, opts={"include_object": include_object, "compare_type": True})
              diff = compare_metadata(ctx, Base.metadata)
          found = any("drift_probe" in str(d) for d in diff)
          print("detected:", found)
          raise SystemExit(0 if found else 1)
          PY
          detected=$?
          set -e
          git checkout -- models.py
          if [ "$detected" -ne 0 ]; then
            echo "::error::The drift detector did NOT notice an un-migrated model column. The gate is not working."
            exit 1
          fi
          echo "the drift detector fails on real drift"

      # 2. THE UPGRADE PATH, including the #513 reproduction.
      - name: Deployment migration contract
        working-directory: backend
        run: python verify_pg_deploy.py 5432

      # 2b. ADR-0021's eight tables (0009), migrated from a POPULATED previous
      #     revision built from the frozen snapshot: every row survives, the
      #     schema matches models.py, PostgreSQL itself refuses a second
      #     statement per period and a second acceptance per revision, the
      #     downgrade/upgrade round trip is clean, and offboarding a factory is
      #     not blocked by the span foreign key. SQLite cannot show any of the
      #     length, NOT NULL-without-default or foreign-key behaviour.
      - name: Agreed-downtime-attribution tables (0009) on PostgreSQL
        working-directory: backend
        run: python verify_pg_outcome_contracts.py 5432

      # 2c. ADR-0029's closed-loop table (0011), migrated from a POPULATED
      #     previous revision: every row survives, the schema matches models.py,
      #     and PostgreSQL itself refuses a second outcome for one action, an
      #     outcome with no tenant, and a metric or verdict past its column --
      #     while ACCEPTING a NULL reading, which is the design. SQLite shows
      #     none of the length, NOT NULL or foreign-key behaviour.
      - name: Closed-loop outcome table (0011) on PostgreSQL
        working-directory: backend
        run: python verify_pg_action_outcomes.py 5432

      # 2d. ADR-0038's consent scope column (0012), migrated from a POPULATED
      #     previous revision: every consent row survives with its decision,
      #     the new column is NULL for them (no backfill invents a provider),
      #     the schema matches models.py, the downgrade/upgrade round trip is
      #     clean, and a grant made after the upgrade records its provider.
      - name: Consent scope column (0012) on PostgreSQL
        working-directory: backend
        run: python verify_pg_consent_scope.py 5432

      # 3. The suites that specifically guard this area, on PostgreSQL rather
      #    than SQLite — SQLite hid a foreign-key failure in the OEM work and
      #    would hide these too.
      - name: Schema-guard and boot-migration suites on PostgreSQL
        working-directory: backend
        run: |
          python test_schema_guard.py
          python test_boot_migrations.py
          python test_migrate.py

      # 4. THE APPROVAL LOCK ON POSTGRESQL (ADR-0015 addendum). Two approvers
      #    deciding one proposal at the same instant are held apart only by
      #    SELECT ... FOR UPDATE on the item row, which SQLite cannot hold: in
      #    the backend job test_agent_item_lock.py section 11 prints SKIP, and
      #    mutate_approval_gate.py reports two row-lock mutations as pg-only.
      #    verify_pg_approvals.py runs the gate and lock suites on scratch
      #    databases of this service, fails if section 11 skipped, and requires
      #    every PostgreSQL-only mutation to be caught.
      - name: Approval gate and held-item lock on PostgreSQL
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: python verify_pg_approvals.py 5432

      # 5. THE ADVERSARIAL AUDITS THAT NEED POSTGRESQL. Each plays the attacker
      #    against a populated world on this service:
      #      audit_oem_adversarial    two OEMs against three factories, over
      #                               HTTP, WebSocket, MQTT and CSV exports
      #      audit_oem_pilot_journey  a manufacturer onboarded and its machine
      #                               accepted by a factory, with no developer
      #      audit_three_customers    three tenants sharing every identifier
      #      audit_isolation          every scoped model, read and written
      #                               across tenants, and NULL-tenant rows
      #    They ran only by hand, which is how the specialist audit and 13
      #    mutation tests went stale unseen (#633, #635, #638). Together they take
      #    under half a minute. Each works in its own scratch database on this
      #    service, never amp_ci.
      - name: The OEM boundary holds under attack on PostgreSQL (audit)
        working-directory: backend
        run: python audit_oem_adversarial.py 5432
      - name: The OEM pilot journey completes without a developer (audit)
        working-directory: backend
        run: python audit_oem_pilot_journey.py 5432
      - name: Three customers with identical identifiers never cross (audit)
        working-directory: backend
        run: python audit_three_customers.py --pg
      - name: No cross-tenant exposure across every scoped model (audit)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/amp_isolation"
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE amp_isolation"
          python audit_isolation.py
      # The simulator audit again, on PostgreSQL: the backend job runs it on
      # SQLite, which does not enforce foreign keys or the per-tenant unique
      # constraints by default. A tick that wrote a row pointing at a parent
      # that does not exist, or issued a document number twice, would pass
      # there and be refused here.
      - name: Three factories animated by one simulator loop never cross, on PostgreSQL (audit)
        working-directory: backend
        run: python audit_three_factory_simulation.py --pg

      # 6. THE MIGRATION VERIFICATIONS THAT RAN ONLY BY HAND. Each migrates a
      #    populated scratch database on this service through one migration and
      #    asks PostgreSQL itself to refuse what the migration forbids: per-tenant
      #    BOM and document numbers, the machine identity constraint, the OEM
      #    foundation (0006-0008) against a live fleet, the AI-consent table
      #    (0009), and 25 two-thread races for one claim code. One had already
      #    gone stale: verify_pg_native_ai upgraded to "head", and failed when
      #    0010 moved head, on a migration that was still correct. It now names
      #    its revision. Together they take under a minute.
      - name: Per-tenant BOM migration on PostgreSQL
        working-directory: backend
        run: python verify_pg_bom.py
      - name: Per-tenant document-number migration on PostgreSQL
        working-directory: backend
        run: python verify_pg_docnumbers.py
      - name: Machine identity migration on a database with duplicates
        working-directory: backend
        run: python verify_pg_migration.py
      - name: OEM foundation migrations (0006-0008) against a live fleet
        working-directory: backend
        run: python verify_pg_oem.py 5432
      - name: The AI-consent table (0009) on PostgreSQL
        working-directory: backend
        run: python verify_pg_native_ai.py 5432
      # A UNIQUE constraint over a NULLABLE column, added to a table that is
      # already full. SQLite cannot judge either half: it has no ALTER TABLE ADD
      # CONSTRAINT (the migration uses a batch rebuild), and whether NULL is
      # distinct from NULL for a unique index is exactly the kind of thing that
      # must be proven on the engine production actually runs.
      - name: Gateway credentials and production idempotency (0013) on PostgreSQL
        working-directory: backend
        run: python verify_pg_gateway_credentials.py 5432

      - name: Exactly one factory wins a raced claim code
        working-directory: backend
        run: python verify_pg_claim.py 5432

  # Branch-coverage floor. A SEPARATE job from `backend` on purpose.
  #
  # The `backend` job's answer is "do the tests pass", and that answer must not
  # be polluted by a second, weaker question. If the floor lived in that job, a
  # coverage dip would turn the checks list red with the same colour as a real
  # failure and the first instinct would be to lower the number. Kept apart, the
  # two failures are told apart at a glance.
  #
  # It re-runs the suites rather than reusing the other job's run because the
  # per-file runner CI contracts on (`python test_X.py`, one process per suite)
  # cannot be measured without combining 169 coverage files. pytest collects the
  # same functions in one process — see backend/conftest.py for the two shims
  # that makes possible, and docs/TESTING.md for why the runner stays as it is.
  #
  # pytest-cov is installed HERE and not in requirements.txt: it is a measurement
  # tool, not something the application needs at runtime, and putting it in the
  # runtime image to satisfy a CI job is how deployment images grow.
  coverage:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install coverage tooling
        run: pip install "pytest-cov>=5,<8"
      # --cov-fail-under lives on the command line, NOT in .coveragerc. A
      # config-level floor also applies to a partial run, so `pytest test_oee.py
      # --cov` would exit non-zero every single time and train everyone to
      # ignore the number. The threshold is derived from a measurement and the
      # arithmetic behind it is in docs/TESTING.md — raise it as the number
      # climbs, never lower it to make a build pass.
      - name: Branch coverage floor
        working-directory: backend
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=78
      # The full report is worth reading even when the gate passes: it is the
      # only place the untested modules are named.
      - name: Publish the report
        if: always()
        working-directory: backend
        run: |
          {
            echo '### Backend branch coverage'
            echo
            echo '```'
            python -m coverage report --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      # Runs the same 184 tests as `npm test` plus the coverage thresholds from
      # vitest.config.ts, so it replaces rather than duplicates the unit-test
      # step. Unlike the backend — where coverage is a separate job because
      # re-running the suites costs 90s — Vitest measures in the same pass for
      # about a second, so a second job would buy nothing but a second npm ci.
      #
      # The thresholds are scoped to lib/. That is deliberate and it is NOT a
      # claim about the whole frontend: components/ and app/ have no unit tests
      # and are covered by the e2e job instead. docs/TESTING.md has the numbers
      # for both scopes side by side so the figure cannot be quoted out of
      # context.
      - name: Unit tests + coverage floor
        run: cd frontend && npm run test:coverage
      - name: Build frontend
        run: cd frontend && npm run build
      # The load harness's endpoint catalogue is a hand transcription of
      # fetchAll() in app/dashboard/page.tsx. The moment someone adds a card and
      # forgets to update it, the harness stops measuring the real dashboard
      # while still printing confident-looking numbers — and a silently wrong
      # benchmark is worse than none, because people act on it.
      #
      # Plain Node, no k6 and no server, so it costs a second and can be a
      # required check rather than something that runs when someone remembers.
      - name: Load-harness endpoint drift
        run: node load/check-drift.mjs

  # Browser tests. A separate job from `frontend` on purpose: it needs a browser
  # binary (~150MB) that the unit-test job has no use for, and keeping them
  # apart means a Playwright failure names itself in the checks list rather than
  # hiding inside a job called "frontend".
  #
  # No backend and no database. Every request is answered by page.route()
  # interception from e2e/support/mock-api.ts, so the suite is deterministic and
  # tests the FRONTEND's behaviour rather than the API's availability. Set
  # E2E_LIVE_API=1 locally to drive a real backend instead.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      # Only chromium: playwright.config.ts pins a single browser project, and
      # installing the other two would triple the download for no coverage.
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      # playwright.config.ts builds and serves the app itself (webServer), so
      # there is no separate build step here.
      - name: Browser tests
        run: cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        # Upload on failure too - the trace and screenshots are the whole point
        # of having a report when a browser test fails in CI and not locally.
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

