# Alembic configuration for AMP.
#
# sqlalchemy.url is deliberately BLANK. The URL comes from the DATABASE_URL
# environment variable at runtime (see alembic/env.py) — the same variable
# database.py reads — so there is exactly one place a connection string is
# configured and no chance of a checked-in URL pointing a migration at the
# wrong database.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Revision filenames sort chronologically and read as a changelog:
#   0001_baseline.py, 20260804_1200_per_tenant_uniqueness.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
