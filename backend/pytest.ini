# pytest configuration for the backend.
#
# pytest is an ADDITIVE runner here, not a replacement. CI's contract is still
# `python test_X.py` per suite (exit 0 = pass); this file exists so the same
# suites can also be collected in one process, which is what makes coverage
# measurement and "-k" filtering possible. See docs/TESTING.md.
#
# Deliberately NOT here: --cov in addopts. pytest-cov is a measurement tool, not
# a dependency of the suites, and it is not in requirements.txt. If --cov lived
# in addopts, a bare `pytest` would die with "unrecognized arguments" on any
# machine without the plugin — including CI, which installs requirements.txt and
# nothing else. Coverage is opt-in on the command line; branch mode and the
# exclusions live in .coveragerc, which pytest-cov picks up automatically.
[pytest]
# rootdir is backend/, so `pytest` from here collects the flat test_*.py files
# and nothing else. The suites use flat imports (`import models`), which works
# because pytest prepends this directory to sys.path when it imports them.
testpaths = .

# The collection contract that lets untouched standalone scripts be collected:
# module-level functions named test_*, in files named test_*.py. No classes, no
# fixtures required, no pytest import in the suites themselves.
python_files = test_*.py
python_functions = test_*

# venv/ is already a pytest default, but alembic/ is not, and its versions/
# directory will fill with migration scripts that must never be collected.
norecursedirs = venv .venv alembic node_modules __pycache__ .pytest_cache .git

# -ra surfaces the reason for every non-pass at the end of the run; with 1000
# tests, a silently skipped suite is otherwise invisible.
# --strict-markers / --strict-config turn a typo in a marker or an ini key into
# an error instead of a warning that scrolls past.
addopts = -ra --strict-markers --strict-config

# Only the two known, pre-existing deprecation streams are silenced, and only by
# exact type/message. They are library-migration debt (Pydantic v2 class-based
# Config; FastAPI lifespan events), not test signal, and between them they emit
# ~60 lines of summary on every run — enough to bury a warning that does matter.
# There is deliberately no blanket `ignore::DeprecationWarning`.
#
# Note what is NOT silenced: PytestReturnNotNoneWarning. One suite
# (test_event_bus.py) has a test that returns a tuple instead of asserting.
# pytest has announced that will become an error, so the warning is the ratchet
# that stops it being forgotten.
filterwarnings =
    ignore::pydantic.PydanticDeprecatedSince20
    ignore:(?s).*on_event is deprecated:DeprecationWarning
