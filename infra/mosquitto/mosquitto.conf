# AMP's production MQTT broker.
#
# WHAT THIS FILE IS NOT: it carries no usernames, no passwords and no topic
# grants. Those are RENDERED AT BOOT by entrypoint.sh from the service's
# environment, into `passwd` and `acl` beside this file. Identity belongs in the
# platform's secret store, not in a file in the repository.
#
# READ backend/mqtt_identity.py BEFORE CHANGING ANYTHING HERE. Its whole premise
# is that `{prefix}/{tenant}/{site}/machines` is a claim THE BROKER HAS ALREADY
# CHECKED — a topic the publisher was not authorised for never reaches AMP. The
# ACL this config loads is the thing that makes that true. Weaken it and AMP's
# tenant isolation over MQTT silently becomes "whatever the gateway typed".

# password_file and acl_file below are global rather than per-listener. Stated
# explicitly because mosquitto's default flipped meaning between 1.x and 2.x and
# a silent per-listener reading would apply the ACL to one listener only.
per_listener_settings false

# ── identity: who is speaking ──────────────────────────────────────────
# There is no anonymous path. docker-compose.yml's own comment says "never point
# a production deployment at an anonymous broker"; this is where that is
# enforced rather than hoped for. A client with no credentials is refused before
# it can subscribe or publish anything.
allow_anonymous false
password_file /mosquitto/config/passwd

# ── authority: what they may say, and where ────────────────────────────
# DEFAULT DENY. mosquitto refuses every topic this file does not explicitly
# grant, so a gateway added to the passwd file but forgotten in the ACL can
# publish nothing at all. That is the correct direction to fail: a mute gateway
# is a support ticket, a gateway that can write into any tenant is a breach.
acl_file /mosquitto/config/acl

# ── listener ───────────────────────────────────────────────────────────
# No bind address: mosquitto binds every address getaddrinfo returns, which is
# both the IPv4 and the IPv6 wildcard. The IPv6 half is load-bearing on Railway
# — its private network (`*.railway.internal`, how the AMP backend reaches this
# container) is IPv6-ONLY, so a v4-only listener would be unreachable from the
# one client that matters most.
listener 1883
protocol mqtt

# ── persistence ────────────────────────────────────────────────────────
# Sessions and queued messages survive a broker restart. Without this, every
# redeploy of THIS service silently discards whatever it was holding for a
# subscriber that happened to be down at the same moment.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# ── queueing for a subscriber that is not there ────────────────────────
# The edge gateway buffers what it cannot SEND. Nothing on the edge can help
# once the broker has acknowledged a packet — from that instant the message is
# the broker's problem, and if AMP is mid-deploy the broker is the only thing
# standing between "AMP restarted" and "that minute of production is gone".
#
# mosquitto's default of 1000 is roughly 8 minutes of one machine at 2 Hz. A
# deploy plus a migration can exceed that, so this is sized for a genuine
# outage rather than a blip.
max_queued_messages 100000
queue_qos0_messages false

# How long a disconnected persistent session is kept before the broker throws it
# away. Long enough to cover a weekend outage discovered on Monday morning.
persistent_client_expiration 14d

# NOTE, AND IT IS THE WHOLE REASON THE THREE SETTINGS ABOVE ARE NOT YET DOING
# ANYTHING: a broker can only queue for a session it has been told to keep.
# backend/mqtt_service.py:_build_client still constructs a bare `mqtt.Client()`
# — paho's default is a RANDOM client id and clean_session=True — so AMP's
# subscription is discarded the moment it disconnects and the broker has no
# session to queue against. Until that is fixed, anything published while AMP is
# restarting is dropped here, and the gateway will have been PUBACKed for it.
# Fixing the broker side first is deliberate: the fix is untestable without one.

# ── logging ────────────────────────────────────────────────────────────
# stdout because that is what Railway's log viewer reads. connection_messages is
# on so the log answers "did the gateway ever actually reach us, and under which
# username" — the first question of every commissioning visit.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
